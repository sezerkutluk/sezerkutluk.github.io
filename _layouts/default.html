<!DOCTYPE html>
{% if page.usemathjax %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<html lang="{{ page.lang | default: site.lang | default: " en" }}">

{%- include head.html -%}

<body>

  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {% if page.layout == "post" or page.url == "/" %}
      <img
        src="https://api.visitorbadge.io/api/visitors?path={{ site.url }}{{ page.url | url_encode }}&label=visitors%20since%20Aug%202026&countColor=%23263759"
        alt="visitors counter" />
      {% endif %}
      {{ content }}
    </div>
  </main>

  {%- include footer.html -%}

</body>

</html>
