<!DOCTYPE html>
{% if page.usemathjax %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<html lang="{{ page.lang | default: site.lang | default: " en" }}">

{%- include head.html -%}

<body>

  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
      {% if page.layout == "post" or page.url == "/" %}
      <div style="margin-top: 20px;">
        <span id="stats-counter"></span>
      </div>
      {% endif %}
    </div>
  </main>

  {%- include footer.html -%}

  <script data-goatcounter="https://sezer-github.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {% if page.layout == "post" or page.url == "/" %}
  <script>
    window.goatcounter = {
      onload: function (count) {
        var el = document.getElementById('stats-counter');
        if (el) el.innerHTML = 'Visitors: ' + count.value;
      }
    };
  </script>
  {% endif %}

</body>

</html>
